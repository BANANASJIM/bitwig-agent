name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / MCP ${{ matrix.mcp }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        mcp: ["locked"]
        include:
          - python: "3.11"
            mcp: "1.29.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - name: Install locked development and audio-analysis dependencies
        run: uv sync --locked --group native-music
      - name: Install the minimum supported MCP SDK
        if: matrix.mcp != 'locked'
        run: uv pip install --python .venv/bin/python "mcp==${{ matrix.mcp }}"
      - name: Run host-free Python checks
        run: uv run --no-sync python scripts/check.py --layer offline

  package:
    name: Package / Python ${{ matrix.python }} / MCP ${{ matrix.mcp }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            mcp: "current"
          - python: "3.11"
            mcp: "1.29.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - name: Build source and wheel distributions
        run: uv build --no-sources
      - name: Exercise installed wheel and sdist consumers
        env:
          MCP_VERSION: ${{ matrix.mcp }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          for distribution in dist/*.whl dist/*.tar.gz; do
            consumer="$(mktemp -d "$RUNNER_TEMP/package-consumer.XXXXXX")"
            uv venv --python "$PYTHON_VERSION" "$consumer/venv"
            dependencies=("$PWD/$distribution")
            if [[ "$MCP_VERSION" != current ]]; then
              dependencies+=("mcp==$MCP_VERSION")
            fi
            uv pip install --no-cache --python "$consumer/venv/bin/python" "${dependencies[@]}"
            "$consumer/venv/bin/python" -I scripts/smoke-package.py
          done
      - name: Validate the Agent Skills folder with the reference CLI
        run: >-
          uvx --from
          'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          skills-ref validate skills/bitwig-agent

  secrets:
    name: Reachable-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all reachable commits without suppression comments
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts='--all --full-history -m' \
            --redact=100 --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaks-ignore" \
            --no-banner --no-color
