name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - name: Install locked development and audio-analysis dependencies
        run: uv sync --locked --group native-music
      - name: Run host-free Python checks
        run: uv run --locked python scripts/check.py --layer offline

  package:
    name: Python package consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.14"
      - name: Build source and wheel distributions
        run: uv build --no-sources
      - name: Exercise the installed wheel's offline CLI
        run: |
          uv venv --python 3.14 .package-venv
          uv pip install --python .package-venv/bin/python dist/*.whl
          .package-venv/bin/bitwig-agent-rpc list
      - name: Connect using the installed tool's generated MCP configuration
        run: |
          .package-venv/bin/bitwig-agent-install --version
          .package-venv/bin/python - <<'PY'
          import asyncio
          import json
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          installer = Path(sys.executable).parent / "bitwig-agent-install"
          config = json.loads(subprocess.check_output(
              [str(installer), "--mcp-config"], text=True
          ))["mcpServers"]["bitwig-agent"]

          async def check():
              with tempfile.TemporaryDirectory() as cwd:
                  async with stdio_client(StdioServerParameters(**config, cwd=cwd)) as streams:
                      async with ClientSession(*streams) as session:
                          initialized = await session.initialize()
                          tools = await session.list_tools()
                          names = {tool.name for tool in tools.tools}
                          assert {"tracks.list", "notes.edit"} <= names, names
                          print(f"{initialized.serverInfo.name}: {len(names)} tools via installed configuration")

          asyncio.run(asyncio.wait_for(check(), timeout=30))
          PY

  secrets:
    name: Reachable-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all reachable commits without suppression comments
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts='--all --full-history -m' \
            --redact=100 --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaks-ignore" \
            --no-banner --no-color
