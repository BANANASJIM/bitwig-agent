name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / MCP ${{ matrix.mcp }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", mcp: "locked", environment: py311 }
          - { python: "3.14", mcp: "locked", environment: py314 }
          - { python: "3.11", mcp: "2.3.0", environment: py311-mcp-min }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          environments: ${{ matrix.environment }}
      - name: Run host-free Python checks
        run: pixi run --environment ${{ matrix.environment }} test

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          environments: default
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/deps
          key: lint-deps-${{ hashFiles('scripts/lint.py') }}
      - name: Run static gates
        run: pixi run lint

  java:
    name: Java tests and fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          environments: default
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/deps
          key: java-deps-${{ hashFiles('extension/deps.toml') }}
      - name: Compile and run Java tests
        run: pixi run test-java
      - name: Run the Python/Java fixture
        run: pixi run fixture

  check:
    name: Check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          environments: default
          locked: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/deps
          key: check-deps-${{ matrix.os }}-${{ hashFiles('scripts/lint.py', 'extension/deps.toml') }}
      - name: Run lint, offline tests, Java tests and fixture
        run: pixi run check

  package:
    name: Package / Python ${{ matrix.python }} / MCP ${{ matrix.mcp }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.14", mcp: "current", environment: py314, smoke-args: "" }
          - { python: "3.11", mcp: "2.3.0", environment: py311-mcp-min, smoke-args: "--mcp 2.3.0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          environments: ${{ matrix.environment }}
      - name: Build source and wheel distributions
        run: pixi run --environment ${{ matrix.environment }} dist
      - name: Exercise installed wheel and sdist consumers
        run: pixi run --environment ${{ matrix.environment }} smoke-dist ${{ matrix.smoke-args }}
      - name: Validate the Agent Skills folder with the reference CLI
        run: pixi run --environment ${{ matrix.environment }} validate-skills

  secrets:
    name: Reachable-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all reachable commits without suppression comments
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts='--all --full-history -m' \
            --redact=100 --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaks-ignore" \
            --no-banner --no-color
