name: Feature request
description: A Bitwig task an agent cannot do yet, or a workflow that should be easier.
labels: ["enhancement"]
body:
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What you or your agent are trying to do in Bitwig, in musical or workflow terms.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: The closest existing method and where it falls short, or "no method covers this".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested shape (optional)
      description: A method, field or result you have in mind. Bitwig documentation or behaviour you observed helps.
  - type: input
    id: bitwig-version
    attributes:
      label: Bitwig Studio version and platform (optional)
      placeholder: "6.1.7 on Linux"
