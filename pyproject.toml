[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bitwig-agent"
version = "0.4.0"
description = "Thin stdio MCP adapter for the local Bitwig Controller Extension"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3.0,<3", "pydantic>=2.12,<3"]
keywords = ["bitwig", "mcp", "midi", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

[project.urls]
Homepage = "https://github.com/BANANASJIM/bitwig-agent"
Documentation = "https://github.com/BANANASJIM/bitwig-agent/blob/main/INSTALL.md"
Repository = "https://github.com/BANANASJIM/bitwig-agent"
Issues = "https://github.com/BANANASJIM/bitwig-agent/issues"
Releases = "https://github.com/BANANASJIM/bitwig-agent/releases"

[tool.hatch.build.targets.sdist]
# Downstream recipes contain the released sdist's checksum, not source inputs.
exclude = ["/packaging"]

[project.scripts]
bitwig-agent = "bitwig_agent.frontends.mcp:main"
bitwig-agent-rpc = "bitwig_agent.frontends.cli:main"
bitwig-agent-install = "bitwig_agent.install:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/bitwig_agent"]
data_file = "build/coverage/.coverage"


[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "C90", "PERF", "PT", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/bitwig_agent"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
bitwig-agent = { path = ".", editable = true }

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.mcp-min.pypi-dependencies]
mcp = "==2.3.0"

[tool.pixi.feature.dev.dependencies]
diff-cover = "==11.0.4"
mypy = "==2.4.1"
pytest = ">=8.3,<9"
pytest-cov = "==7.1.0"
ruff = "==0.17.6"

[tool.pixi.feature.native-music.dependencies]
numpy = ">=2,<3"
scipy = ">=1.15,<2"
pysoundfile = ">=0.13,<1"

[tool.pixi.feature.java.dependencies]
openjdk = "25.*"
pmd = "*"

[tool.pixi.feature.package.dependencies]
hatchling = "*"
python-build = "*"
skills-ref = "*"

[tool.pixi.environments]
default = ["py314", "dev", "native-music", "java", "package", "workstation"]
py314 = ["py314", "dev", "native-music", "package"]
py311 = ["py311", "dev", "native-music", "package"]
py311-mcp-min = ["py311", "mcp-min", "dev", "native-music", "package"]

[tool.pixi.feature.dev.tasks]
test = "pytest -q"

[tool.pixi.feature.java.tasks]
lint = "python scripts/lint.py"
fmt = "python scripts/lint.py --fix"
test-java = "python scripts/test-java.py"
coverage = "python scripts/coverage-gate.py"
fixture = "python scripts/smoke-mcp-java.py"
extension = "python scripts/build.py"

[tool.pixi.feature.package.tasks]
dist = "python -m build --no-isolation --outdir dist"
smoke-dist = "python scripts/smoke-dists.py"
validate-skills = "agentskills validate skills/bitwig-agent"

[tool.pixi.feature.workstation.tasks]
check = "python scripts/check.py"
build = { depends-on = ["dist", "extension"] }
install = { cmd = "bitwig-agent-install --extension build/BitwigAgent.bwextension", depends-on = ["extension"] }
